# Application complète : `make up` (ou `docker compose up -d --build`)
name: ai-bookshelf

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aibookshelf}
      POSTGRES_USER: ${POSTGRES_USER:-aibookshelf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aibookshelf}
    volumes:
      # Postgres 18 stocke ses données sous /var/lib/postgresql/18/docker : on monte le dossier parent
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-aibookshelf}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-aibookshelf}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-aibookshelf}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    ports:
      # Seul port exposé, et uniquement sur la machine locale
      - "127.0.0.1:${APP_PORT:-8737}:8081"

volumes:
  db-data:
